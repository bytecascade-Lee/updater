name: Release

on:
    push:
        # 只匹配 v 开头的 tag（v0.1.0、v0.1.0-rc.1 等）
        # 含 alpha/beta 的在 release_ci.py 内校验并报错
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            version:
                description: '发布版本号（不带 v），例如 0.1.0 或 0.1.0-rc.1'
                required: true
                type: string
            draft:
                description: '发布草稿'
                required: false
                type: boolean
                default: false

permissions:
    contents: write

env:
    PYTHONIOENCODING: utf-8

jobs:
    validate:
        name: Validate version
        runs-on: windows-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup uv
                uses: astral-sh/setup-uv@v5

            -   name: Check version (fail fast on alpha/beta)
                env:
                    INPUT_VERSION: ${{ inputs.version }}
                run: uv run python -c "import sys; sys.path.insert(0, 'scripts'); from release_ci import ci_version; ci_version()"

    build:
        name: Build & upload assets (${{ matrix.target }})
        needs: validate
        runs-on: windows-latest
        strategy:
            fail-fast: false
            matrix:
                target:
                    - x86_64
                    - arm64
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Setup uv
                uses: astral-sh/setup-uv@v5

            -   name: Setup Go
                uses: actions/setup-go@v5
                with:
                    go-version-file: go.mod

            # 版本号/arch/产物命名全部由 release_ci.py 从 GitHub 环境变量推导，workflow 不再重复实现
            -   name: Build & package
                env:
                    INPUT_VERSION: ${{ inputs.version }}
                run: uv run python scripts/release_ci.py build --target ${{ matrix.target }}

            -   name: Upload artifacts
                uses: actions/upload-artifact@v7
                with:
                    name: release-assets-${{ matrix.target }}
                    path: updater-*-windows-*.exe
                    if-no-files-found: error

    release:
        name: Publish GitHub & CNB releases
        needs: build
        runs-on: windows-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup uv
                uses: astral-sh/setup-uv@v5

            -   name: Install cnb cli
                shell: pwsh
                run: npm install -g @cnbcool/cnb-cli

            -   name: Download build artifacts
                uses: actions/download-artifact@v7
                with:
                    path: assets
                    pattern: release-assets-*
                    merge-multiple: true

            -   name: List assets
                shell: pwsh
                run: |
                    if (Test-Path assets) {
                      Get-ChildItem assets -Recurse
                    } else {
                      Write-Host "assets directory not found"
                    }

            # 先发布 GitHub Release，后同步发布 CNB Release（含自动更新清单），
            # 逻辑集中在 scripts/publish.py
            -   name: Publish GitHub & CNB releases
                env:
                    GH_TOKEN: ${{ github.token }}
                    CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
                    CNB_REPO: ordinary-glory/updater
                    DRAFT_RELEASE: ${{ inputs.draft }}
                    INPUT_VERSION: ${{ inputs.version }}
                run: uv run python scripts/publish.py
